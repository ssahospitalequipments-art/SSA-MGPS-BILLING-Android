name: Build SSA MGPS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip SSA_MGPS_Billing_Modern_GitHub_Project_Fixed.zip -d android-project           
          mkdir -p android-project/app/src/main/res/drawable
          cp ic.launcher.png android-project/app/src/main/res/drawable/ic_launcher.png
          cp AndroidManifest.xml android-project/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSA-MGPS-Billing-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
